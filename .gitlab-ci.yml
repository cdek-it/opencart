---
image:
  name: docker-web.cdek.ru/phnodenx-dev-rocky8-7.4:latest
  entrypoint: ['']

stages:
  - maintenance
  - sync
  - build
  - test
  - upload
  - deploy

variables:
  SELECT_JOB:
    value: "none"
    options:
      - "none"
      - "migrate-tag-to-github"
    description: "Выберите запуск job"

  MIGRATE_TAG:
    value: ""
    description: "Тег для переноса из GitLab в GitHub. Например: v4.2.5"

build_tag:
  stage: build
  tags:
    - docker
  only:
    - tags
  before_script:
    - export RELEASE_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/v//')
  script:
    - sed -i "s/\(<version>\)\( *\).*/\1\2${RELEASE_VERSION}<\/version>/" install.xml
    - cd upload/system/library/cdek_official
    - composer i -a
  artifacts:
    name: cdek-integration.ocmod
    paths:
      - upload
      - install.xml

build_custom:
  rules:
    - if: $SELECT_JOB == "migrate-tag-to-github"
      when: never
    - when: manual
  stage: build
  tags:
    - docker
  artifacts:
    name: cdek-integration.ocmod
    paths:
      - upload
      - install.xml
  before_script:
    - !reference [build_tag, before_script]
    - export RELEASE_VERSION="${CI_COMMIT_REF_NAME}#${CI_COMMIT_SHORT_SHA}"
  script:
    - !reference [build_tag, script]
    - composer i -a --no-dev

upload:
  stage: upload
  tags:
    - docker
  needs:
    - job: build_tag
      artifacts: true
  only:
    - tags
  before_script:
    - export RELEASE_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/v//')
    - export ARCHIVE_VERSION=$(echo "${RELEASE_VERSION}" | sed 's/\./_/g')
  script:
    - zip -r cdek.zip upload install.xml
    - curl -u "${NEXUS_LOGIN}":"${NEXUS_PASS}" --upload-file cdek.zip "${ARTIFACTORY_REPO}/$CI_PROJECT_NAME/$CI_COMMIT_BRANCH/opencart_cdek_${ARCHIVE_VERSION}.ocmod.zip"

github:
  image: docker-proxy.cdek.ru/bitnami/git:latest
  stage: sync
  tags:
    - docker
  rules:
    - if: $SELECT_JOB == "migrate-tag-to-github"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  before_script:
    - git config checkout.defaultRemote origin
    - git remote add -f github "https://${GITHUB_AUTH_USERNAME}:${GITHUB_AUTH_TOKEN}@${GITHUB_REPO}" || true
  script:
    - git branch -D $CI_COMMIT_REF_NAME || true
    - git checkout --track origin/$CI_COMMIT_REF_NAME
    - git pull -f --unshallow
    - git fetch github $CI_COMMIT_REF_NAME
    - git branch -u github/$CI_COMMIT_REF_NAME
    - git push

release:
  stage: deploy
  tags:
    - docker
  needs:
    - job: upload
  only:
    - tags
  image: registry-gitlab.cdek.ru/gitlab-org/release-cli:latest
  before_script:
    - export RELEASE_VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/v//')
    - export ARCHIVE_VERSION=$(echo "${RELEASE_VERSION}" | sed 's/\./_/g')
  script:
    - |
      release-cli create --name $CI_COMMIT_TAG --tag-name $CI_COMMIT_TAG \
        --assets-link "{\"name\":\"Архив\",\"filepath\":\"/archive\",
      \"url\":\"${ARTIFACTORY_REPO}$CI_COMMIT_BRANCH/$CI_PROJECT_NAME/opencart_cdek_${ARCHIVE_VERSION}.ocmod.zip\", 
      \"link_type\":\"package\"}" \

sonarqube-check:
  image:
    name: docker-proxy.cdek.ru/sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  tags:
    - docker
  stage: test
  script:
    - sonar-scanner
  allow_failure: true
  rules:
    - if: $SELECT_JOB == "migrate-tag-to-github"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

migrate-tag-to-github:
  image: docker-proxy.cdek.ru/bitnami/git:latest
  stage: maintenance
  variables:
    GIT_DEPTH: "0"
  tags:
    - docker
  rules:
    - if: '$CI_PIPELINE_SOURCE != "web"'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    - if: '$SELECT_JOB == "migrate-tag-to-github"'
      when: on_success
    - when: never
  before_script:
    - set -eu
    - test -n "${MIGRATE_TAG:-}"
    - echo "${MIGRATE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://${GITHUB_AUTH_USERNAME}:${GITHUB_AUTH_TOKEN}@${GITHUB_REPO}"
  script:
    - set -eu
    - echo "Migrating tag ${MIGRATE_TAG} from GitLab to GitHub"
    - git tag -d "${MIGRATE_TAG}" 2>/dev/null || true
    - git fetch origin "refs/tags/${MIGRATE_TAG}:refs/tags/${MIGRATE_TAG}"
    - |
      export GITLAB_TAG_COMMIT="$(git rev-parse "${MIGRATE_TAG}^{commit}")"
      echo "GitLab ${MIGRATE_TAG} commit: ${GITLAB_TAG_COMMIT}"
    - |
      export MIGRATE_TAG_SKIP=""
      if git ls-remote --exit-code --tags github "refs/tags/${MIGRATE_TAG}" >/dev/null 2>&1; then
        echo "Tag ${MIGRATE_TAG} already exists in GitHub. Checking commit..."

        git tag -d "github-${MIGRATE_TAG}" 2>/dev/null || true
        git fetch github "+refs/tags/${MIGRATE_TAG}:refs/tags/github-${MIGRATE_TAG}"

        GITHUB_TAG_COMMIT="$(git rev-parse "github-${MIGRATE_TAG}^{commit}")"
        echo "GitHub ${MIGRATE_TAG} commit: ${GITHUB_TAG_COMMIT}"

        if [ "${GITLAB_TAG_COMMIT}" != "${GITHUB_TAG_COMMIT}" ]; then
          echo "ERROR: GitHub tag ${MIGRATE_TAG} points to different commit"
          exit 1
        fi

        echo "Tag ${MIGRATE_TAG} already exists in GitHub and points to the same commit. Nothing to migrate."
        export MIGRATE_TAG_SKIP="1"
      fi
    - |
      if [ -z "${MIGRATE_TAG_SKIP}" ]; then
        git fetch github main
        if ! git merge-base --is-ancestor "${GITLAB_TAG_COMMIT}" github/main; then
          echo "ERROR: commit ${GITLAB_TAG_COMMIT} (tag ${MIGRATE_TAG}) not found in GitHub main. Sync branches to GitHub first."
          exit 1
        fi

        git push github "refs/tags/${MIGRATE_TAG}:refs/tags/${MIGRATE_TAG}"

        echo "Tag ${MIGRATE_TAG} migrated to GitHub successfully"
      fi
