name: CI
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guide
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: guide/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build production bundle
        env:
          # временно взят идентификатор витрины чат-бота Тая для apidoc.cdek.ru
          # TODO: заменить когда заведут отдельную витрину для этого проекта.
          TAYA_ENTRY_POINT: "11159f62-5743-420a-b473-56ea3113aad3"
        run: yarn docs:build

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: guide/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
